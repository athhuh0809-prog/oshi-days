
<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oshi Days ♡</title><style>:root{font-family:system-ui,sans-serif;color:#43364f;background:#fcf7ff}body{max-width:750px;margin:auto;padding:20px}h1{color:#8a5fa9}section{background:white;border:1px solid #eadcf4;border-radius:16px;padding:18px;margin:18px 0}input,button,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #cdb9df;max-width:100%;box-sizing:border-box}input{margin:4px}button{background:#a47cc3;color:white;border:0;cursor:pointer;margin:4px}li{margin:10px 0}small{color:#786b81}.total{font-size:1.3em;font-weight:bold}</style></head><body><h1>Oshi Days ♡</h1><p>推し活の準備をまとめよう！</p><section><h2>📅 イベント登録</h2><input id="eventName" placeholder="公演名" aria-label="公演名"><input id="eventDate" type="date" aria-label="公演日"><button id="addEvent">登録する</button><ul id="events"></ul></section><section><h2>🎒 持ち物リスト</h2><input id="itemName" placeholder="持ち物" aria-label="持ち物"><button id="addItem">追加する</button><ul id="items"></ul></section><section><h2>🛍️ グッズ購入予算</h2><input id="goodsName" placeholder="グッズ名" aria-label="グッズ名"><input id="goodsPrice" type="number" min="0" placeholder="単価（円）" aria-label="単価"><input id="goodsQty" type="number" min="1" value="1" aria-label="個数"><button id="addGoods">追加する</button><ul id="goods"></ul><p class="total" id="total"></p></section><p id="message" role="status"></p><small>データはこのブラウザ内に保存されます。別の端末とは同期されません。</small><script>
(function(){'use strict';const key='oshi-days-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{events:[],items:[],goods:[]}}catch(e){state={events:[],items:[],goods:[]}}for(const k of ['events','items','goods'])if(!Array.isArray(state[k]))state[k]=[];const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(state));$('message').textContent='保存しました！'}catch(e){$('message').textContent='保存できませんでした。ブラウザの保存設定を確認してください。'}}function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}function render(){for(const [name,element] of [['events','events'],['items','items'],['goods','goods']]){$(element).replaceChildren();state[name].forEach((entry,index)=>{const li=document.createElement('li');if(name==='items'){const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!entry.done;cb.addEventListener('change',()=>{entry.done=cb.checked;save()});li.append(cb,' '+entry.name+' ')}else if(name==='events')li.append(node('span',entry.name+'（'+entry.date+'） '));else li.append(node('span',entry.name+'：'+(entry.price*entry.qty).toLocaleString()+'円（'+entry.qty+'個） '));const del=node('button','削除');del.addEventListener('click',()=>{state[name].splice(index,1);save();render()});li.append(del);$(element).append(li)})}const total=state.goods.reduce((sum,g)=>sum+g.price*g.qty,0);$('total').textContent='合計：'+total.toLocaleString()+'円'}$('addEvent').addEventListener('click',()=>{const name=$('eventName').value.trim(),date=$('eventDate').value;if(!name||!date){$('message').textContent='公演名と日付を入力してね';return}state.events.push({name,date});$('eventName').value='';save();render()});$('addItem').addEventListener('click',()=>{const name=$('itemName').value.trim();if(!name){$('message').textContent='持ち物を入力してね';return}state.items.push({name,done:false});$('itemName').value='';save();render()});$('addGoods').addEventListener('click',()=>{const name=$('goodsName').value.trim(),price=Number($('goodsPrice').value),qty=Number($('goodsQty').value);if(!name||$('goodsPrice').value===''||!Number.isFinite(price)||price<0||!Number.isInteger(qty)||qty<1){$('message').textContent='グッズ名・単価・個数を正しく入力してね';return}state.goods.push({name,price,qty});$('goodsName').value='';$('goodsPrice').value='';$('goodsQty').value='1';save();render()});render()})();
</script></body></html>
